<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="fotos.css">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="poligon.css">
    <title>Galería - 3 Años</title>
</head>
<header>
    <h1>Galeria de fotos <em>3 años</em></h1>
</header>

<body>
    <div class="head">
        <div class="logo">
            <a href="index2.html">
                <div class="outer">
                    <div class="card" style="font-family: 'Pacifico', cursive; color: #ff9cfc;">
                        Inicio 💖
                    </div>
                </div>
            </a>
        </div>
        <nav class="navbar">
            <a href="index2.html">
                <button class="boton-elegante">volver</button>
            </a>
        </nav>
    </div>

    <div class="wrapper">
        <div class="box">
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
            <div> ❤ </div>
        </div>
        <header style="text-align: center; margin-top: 10px;">
            <h1 style="font-family: 'Pacifico', cursive; font-size: 2.8rem; color: #fff; text-shadow: 0 4px 15px rgba(0,0,0,0.3);">Galeria de fotos <em>3 años</em></h1>
        </header>
        <div class="envoltura">
            <div style="text-align: center; margin-bottom: 20px;">
                <label for="foto-input" class="boton-elegante" style="cursor: pointer; display: inline-block; padding: 10px 25px; font-size: 1rem;">
                    ➕ Subir nueva foto
                </label>
                <input type="file" id="foto-input" accept="image/*" style="display: none;" multiple>
            </div>
            <div class="gallery">
                <ul>
                    <li><img src="Fotos/amor1.jpg"></li>
                    <li><img src="Fotos/amor2.jpg"></li>
                    <li><img src="Fotos/amor3.jpg"></li>
                    <li><img src="Fotos/amor4.jpg"></li>
                    <li><img src="Fotos/amor5.jpg"></li>
                    <li><img src="Fotos/amor6.jpg"></li>
                    <li><img src="Fotos/amor7.jpg"></li>
                    <li><img src="Fotos/amor8.jpg"></li>                    
                </ul>
            </div>
            <p class="attribution">Galeria de fotos u.u
            </p>
        </div>
    </div>

    <script>
        const fotoInput = document.getElementById('foto-input');
        const galleryUl = document.querySelector('.gallery ul');

        // IndexedDB para fotos sin límite de tamaño y guardado permanente
        const PHOTO_DB_NAME = 'PhotoAppDB';
        const PHOTO_DB_VERSION = 1;
        let photoDb;

        function initPhotoDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(PHOTO_DB_NAME, PHOTO_DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('photos')) {
                        db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    photoDb = e.target.result;
                    resolve(photoDb);
                };
                request.onerror = (e) => reject(e);
            });
        }

        function savePhotoToDB(blob) {
            return new Promise((resolve, reject) => {
                const transaction = photoDb.transaction(['photos'], 'readwrite');
                const store = transaction.objectStore('photos');
                const request = store.add({ blob });
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e);
            });
        }

        function loadPhotosFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = photoDb.transaction(['photos'], 'readonly');
                const store = transaction.objectStore('photos');
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e);
            });
        }

        function deletePhotoFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = photoDb.transaction(['photos'], 'readwrite');
                const store = transaction.objectStore('photos');
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e);
            });
        }

        // Cargar fotos guardadas
        initPhotoDB().then(async () => {
            const photos = await loadPhotosFromDB();
            photos.forEach(item => {
                const url = URL.createObjectURL(item.blob);
                addGalleryItem(item.id, url, true);
            });
        });

        fotoInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            for (let file of files) {
                const id = await savePhotoToDB(file);
                const url = URL.createObjectURL(file);
                addGalleryItem(id, url, true);
            }
            fotoInput.value = '';
        });

        function addGalleryItem(id, src, isCustom = false) {
            const li = document.createElement('li');
            li.style.position = 'relative';
            li.innerHTML = `
                <img src="${src}" alt="Foto galería">
                ${isCustom ? '<button class="delete-photo-btn" style="position: absolute; top: 8px; right: 8px; background: rgba(255,0,0,0.7); border: none; color: white; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem; z-index: 20; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);" title="Eliminar foto">×</button>' : ''}
            `;

            if (isCustom) {
                li.querySelector('.delete-photo-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (id) {
                        await deletePhotoFromDB(id);
                    }
                    li.remove();
                });
            }

            galleryUl.appendChild(li);
        }

        // Lightbox functionality
        galleryUl.addEventListener('click', (e) => {
            const img = e.target.closest('img');
            // Solo abrimos el visor si se clickea una imagen y NO el botón de borrar
            if (img && !e.target.classList.contains('delete-photo-btn')) {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                lightboxImg.src = img.src;
                lightbox.style.display = 'flex';
            }
        });

        // Eventos para cerrar el lightbox (delegados para funcionar con elementos dinámicos)
        document.addEventListener('click', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (e.target.classList.contains('lightbox-close') || e.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });
    </script>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Imagen ampliada">
    </div>

    <style>
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .lightbox-modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: zoomIn 0.3s ease;
        }
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3rem;
            color: #fff;
            cursor: pointer;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .lightbox-close:hover {
            transform: scale(1.1);
            color: #ff758c;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</body>

</html>
